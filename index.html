<style>
*,*::before,*::after{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
/* Layout: one phone column — section switch, list/summary tabs, swipeable product rows */
:root{
  --bg:#EFF3EE; --surface:#FFFFFF; --sunk:#E3E9E3; --ink:#16201A; --muted:#5B6A60; --line:#D3DCD4;
  --veg:#2E7A3A; --veg-soft:#DDEEDD; --fruit:#C9581A; --fruit-soft:#F8E3D3;
  --yes:#1E8748; --yes-soft:#D7F0E0; --ord:#C2410C; --ord-soft:#FBE3D3;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --acc:var(--veg); --acc-soft:var(--veg-soft);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111613; --surface:#1A211C; --sunk:#232C25; --ink:#E7EEE8; --muted:#97A69B; --line:#2E3931;
  --veg:#5CC26C; --veg-soft:#1F3323; --fruit:#F08A48; --fruit-soft:#3A2618;
  --yes:#4CC77E; --yes-soft:#173325; --ord:#F7894A; --ord-soft:#3B2216; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111613; --surface:#1A211C; --sunk:#232C25; --ink:#E7EEE8; --muted:#97A69B; --line:#2E3931;
  --veg:#5CC26C; --veg-soft:#1F3323; --fruit:#F08A48; --fruit-soft:#3A2618;
  --yes:#4CC77E; --yes-soft:#173325; --ord:#F7894A; --ord-soft:#3B2216; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;overflow:hidden;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
body.obst{--acc:var(--fruit);--acc-soft:var(--fruit-soft)}
.app{max-width:520px;margin:0 auto;height:100%;display:flex;flex-direction:column;gap:7px;padding-block:6px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px}
.logo{display:block;height:42px;width:auto;background:#fff;border-radius:9px;padding:3px 8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.banner{display:block;width:100%;max-width:230px;height:auto;margin:0 auto;border-radius:10px;box-shadow:0 1px 4px rgb(0 0 0/.12)}
h1{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:.02em;margin:0;text-transform:uppercase}
.date{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--sunk);border-radius:10px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;color:var(--muted);font-family:var(--display);font-weight:700;font-size:16px;
  letter-spacing:.04em;text-transform:uppercase;padding:6px;border-radius:8px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--acc);box-shadow:0 1px 3px rgb(0 0 0/.12)}
.steps{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line)}
.steps button{border:0;background:none;color:var(--muted);font:600 14px var(--body);padding:5px 2px 7px;cursor:pointer;
  border-bottom:3px solid transparent;margin-bottom:-1px}
.steps button[aria-current="true"]{color:var(--ink);border-color:var(--acc)}
.stats{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--muted);font:600 12px var(--body);padding:4px 9px;border-radius:999px;cursor:pointer;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.chip.v b{color:var(--yes)}.chip.o b{color:var(--ord)}
.chip[aria-pressed="true"] b{color:inherit}
button:focus-visible,input:focus-visible,.fg:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
main{flex:1;min-height:0;display:flex;flex-direction:column}
.tools{display:flex;gap:6px;margin-bottom:5px}
.tools input{flex:1;min-width:0;font:15px var(--body);padding:7px 10px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--ink)}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 14px var(--body);padding:8px 10px;border-radius:9px;cursor:pointer;white-space:nowrap}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}
.hint{color:var(--muted);font-size:12px;margin:0 0 5px;display:flex;justify-content:space-between;gap:8px}
.hint .r{color:var(--yes);font-weight:600}.hint .l{color:var(--ord);font-weight:600}
.list{flex:1;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:4px;padding-bottom:12px;overscroll-behavior:contain}
.row{position:relative;border-radius:9px;overflow:hidden;flex:none}
.bg{position:absolute;inset:0;display:flex;justify-content:space-between;align-items:center;padding:0 14px;
  font:800 15px var(--display);letter-spacing:.06em}
.bg .l{color:var(--yes)}.bg .r{color:var(--ord)}
.row.sw-r .bg{background:var(--yes-soft)}.row.sw-r .bg .r{visibility:hidden}
.row.sw-l .bg{background:var(--ord-soft)}.row.sw-l .bg .l{visibility:hidden}
.fg{position:relative;display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px;padding:6px 8px;min-height:46px;
  background:var(--surface);border:1px solid var(--line);border-radius:9px;touch-action:pan-y;user-select:none;-webkit-user-select:none;
  cursor:pointer;transition:transform .2s ease}
.fg.drag{transition:none}
.row.var .fg{border-color:var(--yes);box-shadow:inset 4px 0 0 var(--yes)}
.row.sip .fg{border-color:var(--ord);box-shadow:inset -4px 0 0 var(--ord)}
.row.var.sip .fg{border-color:var(--line);box-shadow:inset 4px 0 0 var(--yes),inset -4px 0 0 var(--ord)}
.nm{font-weight:600;line-height:1.15;min-width:0;font-size:14px}
.nm small{display:block;color:var(--muted);font-weight:400;font-size:10px;letter-spacing:.04em}
.side{display:flex;align-items:center;gap:6px}
.bwrap{display:flex;align-items:center;gap:3px}
.badge{min-width:54px;text-align:center;border-radius:8px;padding:3px 6px;line-height:1.05;border:0;cursor:pointer;font-family:var(--body)}
.badge b{display:block;font:800 18px var(--display);font-variant-numeric:tabular-nums}
.badge span{font-size:9px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.badge.v{background:var(--yes-soft);color:var(--yes)}
.badge.o{background:var(--ord-soft);color:var(--ord)}
.minus{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-size:22px;font-weight:600;line-height:1;cursor:pointer;flex:none;padding:0;touch-action:manipulation}
@media (max-width:380px){.badge{min-width:48px}.badge span{font-size:8px}.minus{width:30px;height:30px;font-size:20px}}
.empty{flex:1;display:grid;place-items:center;text-align:center;color:var(--muted);padding:24px}
.empty strong{display:block;font-family:var(--display);font-size:22px;color:var(--ink);margin-bottom:4px}
.res{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding-bottom:16px}
.res h3{font-family:var(--display);font-weight:700;font-size:16px;letter-spacing:.05em;text-transform:uppercase;margin:0 0 5px;display:flex;justify-content:space-between}
.res h3 span{color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px}
.res h3.o{color:var(--ord)}.res h3.v{color:var(--yes)}
.th,.ritem{display:grid;grid-template-columns:1fr 84px;gap:8px;align-items:center}
.th.three,.ritem.three{grid-template-columns:1fr 70px 70px}
.th{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:0 8px 4px}
.th .v,.th .o{text-align:right}.th .v{color:var(--yes)}.th .o{color:var(--ord)}
.ritem{padding:6px 8px;border-radius:8px;background:var(--surface);border:1px solid var(--line);margin-bottom:4px;font-size:14px}
.ritem .q{font-weight:700;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.ritem .q.v{color:var(--yes)}.ritem .q.o{color:var(--ord)}
.seg.small button{font-size:14px;padding:6px}
.resbar{display:flex;gap:6px;flex-wrap:wrap}.resbar .btn{flex:1}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:9px 14px;border-radius:10px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;z-index:5;white-space:nowrap}
.toast.on{opacity:1}
textarea.copy{width:100%;height:150px;font:12px ui-monospace,monospace;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:9px}
@keyframes bump{50%{transform:scale(1.15)}}
.badge.bump{animation:bump .2s}
@media (prefers-reduced-motion:reduce){.fg{transition:none}.badge.bump{animation:none}}
</style>
</head>
<body>
<div class="app">
  <header><h1><img class="logo" src="logo-oval.png" alt="" width="88" height="42"><span class="sr">Meydan Markt</span></h1><span class="date" id="date"></span></header>
  <div class="seg" role="group" aria-label="Bölüm">
    <button id="tab-g" data-tab="g">Sebze</button>

  </nav>
  <main id="main"></main>
</div>

// eski kayıt biçimini ({s,n}) yeni biçime ({v,o}) çevir
for (const k in S.st) { const x=S.st[k]; if (x && x.s) { S.st[k] = x.s==='var' ? {v:x.n,o:0} : {v:0,o:x.n}; S.last[k] = x.s==='var'?'v':'o'; } }

const main = $('#main');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today = () => new Date().toLocaleDateString('tr-TR',{weekday:'short',day:'2-digit',month:'2-digit',year:'numeric'});
$('#date').textContent = today();
let search = '';
function toast(t){ const el=$('#toast'); el.textContent=t; el.classList.add('on'); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove('on'),1600); }
const V = id => S.st[id]?.v || 0, O = id => S.st[id]?.o || 0;
const counts = c => { let v=0,o=0,p=0; BY[c].forEach(id=>{ if(V(id)) v++; if(O(id)) o++; if(!V(id)&&!O(id)) p++; }); return {v,o,p}; };

function render(){
  document.body.classList.toggle('obst', S.tab==='o');
  $('#tab-g').setAttribute('aria-pressed', S.tab==='g'); $('#tab-o').setAttribute('aria-pressed', S.tab==='o');
  $('#st-liste').setAttribute('aria-current', S.view==='liste'); $('#st-ozet').setAttribute('aria-current', S.view==='ozet');
  S.view==='liste' ? renderList() : renderRes();
}

/* ---------- Liste ---------- */
function renderList(){
  main.innerHTML = `
    <div class="tools"><input id="q" type="search" placeholder="Ürün ara" value="${esc(search)}" aria-label="Ürün ara"></div>
    <div class="stats" id="stats"></div>
    <p class="hint"><span class="l">← Sola: sipariş</span><span>Kutuya dokun: +1</span><span class="r">Sağa: var →</span></p>
    <div class="list" id="list"></div>`;
  fillList();
  $('#q').oninput = e => { search = e.target.value; fillList(); };
  bindList($('#list'));
}
function statsHTML(){ const k=counts(S.tab);
  const ch=(f,label,n,cls='')=>`<button class="chip ${cls}" data-f="${f}" aria-pressed="${S.filter===f}">${label} <b>${n}</b></button>`;
  return ch('hepsi','Hepsi',BY[S.tab].length)+ch('bekleyen','Bekleyen',k.p)+ch('var','Var',k.v,'v')+ch('sip','Sipariş',k.o,'o'); }
function badge(id,k){ const n=k==='v'?V(id):O(id); if(!n) return '';
  return `<span class="bwrap ${k}"><button class="minus" data-minus="${k}" aria-label="${k==='v'?'Var':'Sipariş'} bir azalt">−</button>
    <button class="badge ${k}" data-inc="${k}" aria-label="${k==='v'?'Var':'Sipariş'} bir artır"><b>${n}</b><span>${unitOf(id)} ${k==='v'?'var':'sipariş'}</span></button></span>`; }
function rowHTML(id){ const it=ITEMS[id], v=V(id), o=O(id);
  return `<div class="row ${v?'var':''} ${o?'sip':''}" data-id="${id}"><div class="bg"><span class="l">✓ VAR</span><span class="r">SİPARİŞ ✗</span></div>
    <div class="fg" tabindex="0" aria-label="${esc(it.name)}${v?', '+v+' '+unitOf(id)+' var':''}${o?', '+o+' '+unitOf(id)+' sipariş':''}">
      <span class="nm">${esc(it.name)}</span>
      <span class="side">${badge(id,'v')}${badge(id,'o')}</span>
    </div></div>`; }
function fillList(){
  const q=search.toLocaleLowerCase('tr').trim();
  const ids=BY[S.tab].filter(id=>{
    if(S.filter==='bekleyen'&&(V(id)||O(id))) return false; if(S.filter==='var'&&!V(id)) return false; if(S.filter==='sip'&&!O(id)) return false;
    return !q||(ITEMS[id].name+' '+ITEMS[id].code).toLocaleLowerCase('tr').includes(q); });
  $('#stats').innerHTML=statsHTML();
  $('#stats').onclick=e=>{ const b=e.target.closest('.chip'); if(!b) return; S.filter=b.dataset.f; save(); fillList(); };
  $('#list').innerHTML = ids.length ? ids.map(rowHTML).join('') : `<div class="empty"><div><strong>Ürün yok</strong>Bu filtrede gösterilecek ürün bulunmuyor.</div></div>`;
}
function refreshRow(id, bumpK){
  if(S.st[id] && !S.st[id].v && !S.st[id].o){ delete S.st[id]; delete S.last[id]; }
  const r=document.querySelector(`.row[data-id="${id}"]`); if(r){ r.outerHTML=rowHTML(id);
    if(bumpK){ const b=document.querySelector(`.row[data-id="${id}"] .badge.${bumpK}`); if(b) b.classList.add('bump'); } }
  const st=$('#stats'); if(st) st.innerHTML=statsHTML(); save();
}
function add(id,k,d){ const x=S.st[id]||(S.st[id]={v:0,o:0}); x[k]=Math.max(0,(x[k]||0)+d); if(d>0) S.last[id]=k; refreshRow(id,d>0?k:null); }
function swipe(id,k){ add(id,k,1); toast(`${ITEMS[id].name}: ${k==='v'?V(id)+' '+unitOf(id)+' var':O(id)+' '+unitOf(id)+' sipariş'}`); }
function tap(id){ const k=S.last[id]; if(!k||!(k==='v'?V(id):O(id))){ toast('Sağa (var) veya sola (sipariş) kaydır'); return; } add(id,k,1); }

function bindList(list){
  let g=null; const TH=70;
  list.addEventListener('pointerdown', e=>{
    if(e.button>0) return; const fg=e.target.closest('.fg'); if(!fg) return;
    const btn=e.target.closest('[data-minus],[data-inc]');
    if(btn){ g={btn,fg}; return; }
    g={fg,row:fg.parentElement,x:e.clientX,y:e.clientY,dx:0,sw:false,dead:false,pid:e.pointerId};
  });
  list.addEventListener('pointermove', e=>{
    if(!g||g.btn||g.dead) return; const dx=e.clientX-g.x, dy=e.clientY-g.y;
    if(!g.sw){ if(Math.abs(dy)>10&&Math.abs(dy)>Math.abs(dx)){ g.dead=true; return; }
      if(Math.abs(dx)>10&&Math.abs(dx)>Math.abs(dy)){ g.sw=true; g.fg.classList.add('drag'); try{g.fg.setPointerCapture(g.pid);}catch(_){} } else return; }
    g.dx=dx; g.fg.style.transform=`translateX(${dx}px)`;
    g.row.classList.toggle('sw-r',dx>0); g.row.classList.toggle('sw-l',dx<0);
  });
  const end=e=>{ if(!g) return; const s=g; g=null;
    if(s.btn){ if(e.type==='pointerup'&&e.target.closest('[data-minus],[data-inc]')===s.btn){ const id=s.fg.parentElement.dataset.id;
        if(s.btn.dataset.minus) add(id,s.btn.dataset.minus,-1); else add(id,s.btn.dataset.inc,1); } return; }
    const id=s.row.dataset.id;
    if(s.sw){ s.fg.classList.remove('drag');
      if(s.dx>TH){ s.fg.style.transform='translateX(110%)'; setTimeout(()=>swipe(id,'v'),160); }
      else if(s.dx<-TH){ s.fg.style.transform='translateX(-110%)'; setTimeout(()=>swipe(id,'o'),160); }
      else { s.fg.style.transform=''; setTimeout(()=>s.row.classList.remove('sw-r','sw-l'),200); }
      return; }
    if(!s.dead&&e.type==='pointerup') tap(id);
  };
  list.addEventListener('pointerup',end); list.addEventListener('pointercancel',end);
  list.addEventListener('keydown',e=>{ const fg=e.target.closest('.fg'); if(!fg||e.target!==fg) return; const id=fg.parentElement.dataset.id;
    if(e.key==='ArrowRight'){ e.preventDefault(); swipe(id,'v'); } else if(e.key==='ArrowLeft'){ e.preventDefault(); swipe(id,'o'); }
    else if(e.key==='Enter'||e.key===' '){ e.preventDefault(); tap(id); }
    else return; const n=document.querySelector(`.row[data-id="${id}"] .fg`); if(n) n.focus(); });
}

/* ---------- Özet ---------- */
const nm={g:'Sebze',o:'Meyve'};
const rowsFor = (c,mode) => BY[c].filter(id => mode==='sip' ? O(id) : (V(id)||O(id)));
const sum = (ids,f) => ids.reduce((a,id)=>a+f(id),0);
function renderRes(){
  const mode=S.rmode;
  const sec=c=>{ const ids=rowsFor(c,mode); if(!ids.length) return '';
    const head = mode==='sip'
      ? `<div class="th"><span>Ürün</span><span class="o">Sipariş</span></div>`
      : `<div class="th three"><span>Ürün</span><span class="v">Var</span><span class="o">Sipariş</span></div>`;
    const row=id=>{ const u=unitOf(id);
      return mode==='sip'
        ? `<div class="ritem"><span>${esc(ITEMS[id].name)}</span><span class="q o">${O(id)} ${u}</span></div>`
        : `<div class="ritem three"><span>${esc(ITEMS[id].name)}</span><span class="q v">${V(id)?V(id)+' '+u:'–'}</span><span class="q o">${O(id)?O(id)+' '+u:'–'}</span></div>`; };
    const tot = mode==='sip' ? `${ids.length} ürün · ${sum(ids,O)} sipariş` : `var ${sum(ids,V)} · sipariş ${sum(ids,O)}`;
    return `<section><h3>${nm[c]}<span>${tot}</span></h3>${head}${ids.map(row).join('')}</section>`; };
  const body=(S.tab==='g'?['g','o']:['o','g']).map(sec).join('');
  main.innerHTML=`<div class="res">
    <img class="banner" src="logo-banner.jpg" alt="Meydan Markt – Hermannstal 103, 22119 Hamburg – Tel 040 / 639 46 427">
    <div class="seg small" role="group" aria-label="Liste türü">
      <button id="rm-tam" data-m="tam" aria-pressed="${mode==='tam'}">Tüm liste</button>
      <button id="rm-sip" data-m="sip" aria-pressed="${mode==='sip'}">Sipariş verilecek</button></div>
    <div class="resbar"><button class="btn primary" id="pdf">${mode==='sip'?'Sipariş PDF':'PDF indir'}</button><button class="btn" id="copy">Metni kopyala</button><button class="btn" id="reset">Yeni gün</button></div>
    <div id="copyBox"></div>
    ${body||`<div class="empty"><div><strong>${mode==='sip'?'Sipariş yok':'Henüz kayıt yok'}</strong>${mode==='sip'?'Ürün listesinde ürünleri sola kaydırarak sipariş ekle.':'Ürün listesinde ürünleri sağa veya sola kaydır.'}</div></div>`}</div>`;
  main.querySelector('.seg.small').onclick=e=>{ const b=e.target.closest('button'); if(!b) return; S.rmode=b.dataset.m; save(); renderRes(); };
  $('#pdf').onclick=savePdf;
  $('#copy').onclick=()=>{ const t=text(); const fb=()=>{ $('#copyBox').innerHTML='<textarea class="copy" id="ta" readonly></textarea>'; $('#ta').value=t; $('#ta').select(); toast('Metin seçildi, şimdi kopyala'); };
    try{ navigator.clipboard.writeText(t).then(()=>toast('Kopyalandı'),fb); }catch(e){ fb(); } };
  const rb=$('#reset'); rb.onclick=()=>{ if(rb.dataset.arm){ S.st={}; S.last={}; S.view='liste'; S.filter='hepsi'; save(); render(); toast('Yeni gün başladı'); }
    else { rb.dataset.arm=1; rb.textContent='Emin misin? Tekrar bas'; setTimeout(()=>{ if(rb.isConnected){ delete rb.dataset.arm; rb.textContent='Yeni gün'; } },3000); } };
}
function text(){ const sip=S.rmode==='sip';
  let t=`MEYDAN MARKT GMBH – ${sip?'SİPARİŞ LİSTESİ':'STOK VE SİPARİŞ'} ${today()}\n`;
  for(const c of ['g','o']){ const ids=rowsFor(c,S.rmode); if(!ids.length) continue;
    t+=`\n${c==='g'?'SEBZE':'MEYVE'}\n`;
    ids.forEach(id=>{ const u=unitOf(id); t+= sip ? `• ${ITEMS[id].name} – ${O(id)} ${u}\n` : `• ${ITEMS[id].name} – var: ${V(id)} ${u}, sipariş: ${O(id)} ${u}\n`; }); }
  return t; }
const A = s => String(s).replace(/ş/g,'s').replace(/Ş/g,'S').replace(/ğ/g,'g').replace(/Ğ/g,'G').replace(/ı/g,'i').replace(/İ/g,'I');
async function savePdf(){
  const sip=S.rmode==='sip', btn=$('#pdf'), label=btn.textContent;
  if(!['g','o'].some(c=>rowsFor(c,S.rmode).length)){ toast(sip?'Sipariş yok':'Henüz kayıt yok'); return; }
  if(!window.jspdf){ toast('PDF modülü yükleniyor, tekrar dene'); return; }
  btn.disabled=true; btn.textContent='Hazırlanıyor…';
  try{
    const {jsPDF}=window.jspdf; const doc=new jsPDF({unit:'mm',format:'a4'}); const W=210,M=16; let y=20;
    const page=()=>{ if(y>278){ doc.addPage(); y=20; } };
    let top=12, logoOk=false;
    try{ const blob=await fetch('logo-banner.jpg').then(r=>{ if(!r.ok) throw 0; return r.blob(); });
      const url=await new Promise((res,rej)=>{ const fr=new FileReader(); fr.onload=()=>res(fr.result); fr.onerror=rej; fr.readAsDataURL(blob); });
      doc.addImage(url,'JPEG',M,top,52,36.8); logoOk=true; }catch(_){}
    const tx=logoOk?M+58:M; y=logoOk?top+15:20;
    doc.setFont('helvetica','bold'); doc.setFontSize(logoOk?15:18); doc.text(sip?'SIPARIS LISTESI':'STOK VE SIPARIS',tx,y);
    doc.setFontSize(10); doc.setFont('helvetica','normal'); doc.text('MEYDAN MARKT GMBH',tx,y-6.5);
    doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(90);
    doc.text(A(new Date().toLocaleString('tr-TR',{weekday:'long',day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})),tx,y+6);
    doc.setTextColor(0); y = logoOk ? top+36.8+9 : y+14;
    const cV=W-M-32, cO=W-M-1;
    for(const c of ['g','o']){ const ids=rowsFor(c,S.rmode); if(!ids.length) continue;
      y+=2; page(); const rgb=c==='g'?[46,122,58]:[201,88,26]; doc.setFillColor(...rgb); doc.rect(M,y-5,W-2*M,8,'F');
      doc.setTextColor(255); doc.setFont('helvetica','bold'); doc.setFontSize(12);
      doc.text(c==='g'?'SEBZE':'MEYVE',M+2,y);
      doc.text(A(sip?`${ids.length} ürün · ${sum(ids,O)} siparis`:`var ${sum(ids,V)} · siparis ${sum(ids,O)}`),W-M-2,y,{align:'right'});
      doc.setTextColor(0); y+=8;
      doc.setFontSize(8); doc.setTextColor(110); doc.text('URUN',M+1,y);
      if(!sip) doc.text('ELIMIZDE VAR',cV,y,{align:'right'}); doc.text('SIPARIS',cO,y,{align:'right'}); doc.setTextColor(0); y+=1;
      ids.forEach((id,i)=>{ y+=6; page(); if(i%2===0){ doc.setFillColor(243,245,242); doc.rect(M,y-4.3,W-2*M,6,'F'); }
        const u=unitOf(id);
        doc.setFont('helvetica','normal'); doc.setFontSize(11); doc.text(A(ITEMS[id].name),M+1,y);
                doc.setFontSize(11);
        if(!sip){ doc.setTextColor(30,135,72); doc.text(V(id)?`${V(id)} ${u}`:'-',cV,y,{align:'right'}); }
        doc.setFont('helvetica','bold'); doc.setTextColor(194,65,12); doc.text(O(id)?`${O(id)} ${u}`:'-',cO,y,{align:'right'}); doc.setTextColor(0); });
      y+=10; }
    const n=doc.getNumberOfPages(); for(let i=1;i<=n;i++){ doc.setPage(i); doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(140); doc.text(`Sayfa ${i} / ${n}`,W-M,290,{align:'right'}); }
    const d=new Date(), f=`Meydan_${sip?'Siparis':'Stok_Siparis'}_${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}.pdf`;
    const blob=doc.output('blob');
    const download=()=>{ const u=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=u; a.download=f; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),30000); toast('PDF indirildi'); };
    let file=null; try{ file=new File([blob],f,{type:'application/pdf'}); }catch(_){}
    if(file && navigator.canShare && navigator.canShare({files:[file]})){
      try{ await navigator.share({files:[file],title:f}); toast('PDF hazır'); }
      catch(e){ if(e&&e.name==='AbortError') toast('İptal edildi'); else download(); }
    } else download();
  }catch(e){ toast('PDF oluşturulamadı'); }
  finally{ if(btn.isConnected){ btn.disabled=false; btn.textContent=label; } }
}
document.querySelector('.seg').onclick=e=>{ const b=e.target.closest('button'); if(!b) return; S.tab=b.dataset.tab; search=''; save(); render(); };
document.querySelector('.steps').onclick=e=>{ const b=e.target.closest('button'); if(!b) return; S.view=b.dataset.view; save(); render(); };
render();
if('serviceWorker' in navigator && location.protocol.startsWith('http')) window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>

</body>
</html>
